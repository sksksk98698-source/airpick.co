<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" width="160" height="38" fill="none">
  <defs>
    <linearGradient id="airpick-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="airpick-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
  </defs>

  <!-- Icon Group -->
  <g transform="translate(6, 4)">
    <!-- Rounded badge background -->
    <rect width="40" height="40" rx="10" fill="url(#airpick-grad)" />
    
    <!-- Plane takeoff icon (Lucide style) -->
    <path d="M12 28l16 -12l-10 -2l-3 -4l-3 1l1.5 4.5l-3 1.5l-1.5 -1.5l-1.5 0.5l1.5 3l4.5 0.5z" 
          fill="#ffffff" opacity="0.95" />
    
    <!-- Mouse pointer click mark (Pick indicator) -->
    <path d="M25 21l6 6l-3 1l2 4l-2 1l-2 -4l-2 2z" 
          fill="#ffffff" stroke="#0d9488" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Spark / pick star -->
    <circle cx="29" cy="11" r="2" fill="#fef08a" />
  </g>

  <!-- Typography: AirPick -->
  <text x="56" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="26" fill="url(#airpick-grad)" letter-spacing="-0.5">Air<tspan fill="#0f172a" class="dark-invert">Pick</tspan></text>
  
  <!-- Subtext/Domain indicator -->
  <rect x="156" y="16" width="36" height="16" rx="4" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1" />
  <text x="160" y="28" font-family="'SF Mono', Consolas, monospace" font-size="10" font-weight="700" fill="#0d9488">.dev</text>
</svg>
